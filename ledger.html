<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>记账宝</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;color:#333;font-size:15px;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:70px;position:relative}
[v-cloak]{display:none!important}

.summary{display:flex;background:#fff;margin:12px;padding:18px 8px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sum-block{flex:1;text-align:center}
.sum-label{font-size:12px;color:#999;margin-bottom:6px}
.sum-value{font-size:20px;font-weight:700}
.sum-value.green{color:#4CAF50}
.sum-value.red{color:#F44336}
.sum-divider{width:1px;background:#eee}

.actions{display:flex;gap:8px;margin:0 12px 12px}
.btn{flex:1;height:42px;line-height:42px;text-align:center;border:none;border-radius:21px;font-size:14px;background:#fff;color:#4CAF50;border:1px solid #4CAF50}
.btn.primary{background:#4CAF50;color:#fff;border:none}
.btn:disabled{opacity:.5}

.tx-list{padding:0 12px}
.date-group{margin-bottom:14px}
.date-head{display:flex;justify-content:space-between;padding:6px 4px}
.date-text{font-weight:600;font-size:14px}
.date-sum{font-size:11px;color:#999}
.tx-row{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:14px;border-radius:10px;margin-bottom:6px}
.tx-row:active{background:#f9f9f9}
.tx-left{display:flex;align-items:center;gap:12px}
.tx-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.tx-cat{font-size:15px;font-weight:500}
.tx-meta{font-size:12px;color:#999;margin-top:2px}
.tx-amount{font-size:17px;font-weight:700}
.tx-amount.in{color:#4CAF50}
.tx-amount.out{color:#F44336}
.empty{text-align:center;padding:80px 20px;color:#999}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.6}

.fab{position:fixed;bottom:90px;right:calc(50% - 225px);width:56px;height:56px;border-radius:28px;border:none;background:#4CAF50;color:#fff;font-size:28px;box-shadow:0 4px 16px rgba(76,175,80,.35);z-index:99}
@media(max-width:480px){.fab{right:16px}}

.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;z-index:100;padding:6px 0 env(safe-area-inset-bottom)}
.tab-item{flex:1;text-align:center;color:#999;font-size:11px;padding:4px 0}
.tab-item.active{color:#4CAF50}
.tab-emoji{display:block;font-size:24px;margin-bottom:2px}

.island-wrap{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;width:90vw;max-width:380px}
.island{background:#1c1c1e;border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4);transition:all .3s}
.island-bar{display:flex;align-items:center;padding:12px 18px;gap:10px;cursor:pointer}
.island-bar .emoji{font-size:22px}
.island-bar .info{flex:1;display:flex;justify-content:space-between;align-items:center}
.island-bar .src{color:#aaa;font-size:13px}
.island-bar .amt{font-size:16px;font-weight:700}
.island-bar .amt.g{color:#51cf66}.island-bar .amt.r{color:#ff6b6b}
.island-bar .arrow{color:#666;font-size:11px}

.island-detail{border-top:1px solid #333;padding:14px 18px}
.island-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2a2a2a;color:#fff;font-size:14px}
.island-row .lbl{color:#999}
.island-row select,.island-row input{background:#2a2a2a;border:none;color:#fff;font-size:14px;padding:6px 10px;border-radius:6px;text-align:right}
.island-row input.iamt{font-size:18px;font-weight:700;width:120px}
.island-actions{display:flex;gap:10px;padding:14px 18px;border-top:1px solid #333}
.island-actions button{border:none;height:40px;border-radius:20px;font-size:14px;font-weight:500}
.island-actions .btn-no{flex:1;background:#333;color:#ccc}
.island-actions .btn-ok{flex:2;background:#4CAF50;color:#fff}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal-panel{position:fixed;bottom:0;left:0;right:0;z-index:201;background:#fff;border-radius:16px 16px 0 0;max-height:85vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}}
.modal-head{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #eee;font-size:16px}
.modal-body{padding:20px}

.type-toggle{display:flex;margin-bottom:20px;border-radius:8px;overflow:hidden}
.type-btn{flex:1;text-align:center;padding:12px;font-size:15px;background:#f0f0f0;color:#666}
.type-btn.sel-out{background:#F44336;color:#fff}
.type-btn.sel-in{background:#4CAF50;color:#fff}

.amount-box{display:flex;align-items:center;justify-content:center;padding:10px 0 24px}
.amount-box .yuan{font-size:28px;font-weight:700;color:#333;margin-right:4px}
.amount-box input{font-size:42px;font-weight:700;color:#333;width:200px;border:none;outline:none}

.form-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.form-row .fl{font-size:15px;color:#333}
.form-row .fv{font-size:14px;color:#999}
.form-row input{font-size:14px;color:#333;text-align:right;border:none;outline:none;width:160px}

.btn-save{width:100%;height:48px;border:none;border-radius:24px;color:#fff;font-size:16px;font-weight:600;margin-top:24px}
.btn-save.exp{background:#F44336}.btn-save.inc{background:#4CAF50}

.picker-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:210}
.picker{position:fixed;bottom:0;left:0;right:0;z-index:211;background:#fff;border-radius:16px 16px 0 0;max-height:55vh;overflow-y:auto}
.picker-head{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #eee;font-size:15px}
.picker-opt{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #f5f5f5;font-size:15px}

.month-nav{display:flex;justify-content:center;align-items:center;gap:24px;padding:16px;font-size:16px;font-weight:600}
.chart{background:#fff;margin:0 12px 12px;padding:16px;border-radius:12px}
.chart-title{font-size:14px;font-weight:600;color:#555;margin-bottom:12px}
.chart-item{margin-bottom:10px}
.chart-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.chart-bar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.chart-fill{height:100%;border-radius:3px;transition:width .4s}

.set-card{background:#fff;margin:12px;border-radius:12px;overflow:hidden}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #f5f5f5}
.set-row:last-child{border:none}

.dlg-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:300}
.dlg-box{background:#fff;border-radius:14px;padding:24px;width:80vw;max-width:300px;text-align:center}
.dlg-box h3{margin-bottom:8px}.dlg-box p{margin-bottom:20px;color:#666;font-size:13px}
.dlg-btns{display:flex;gap:10px}
.dlg-btns button{flex:1;height:40px;border:none;border-radius:20px;font-size:14px}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;pointer-events:none}
</style>
</head>
<body>
<div id="app" v-cloak>

  <div class="island-wrap" v-if="island.show">
    <div class="island">
      <div class="island-bar" @click="island.open = true">
        <span class="emoji">{{ island.type === 1 ? '💰' : '💸' }}</span>
        <span class="info">
          <span class="src">{{ island.src }}</span>
          <span class="amt" :class="island.type === 2 ? 'r' : 'g'">
            <template v-if="island.amt && Number(island.amt) > 0">{{ island.type === 1 ? '+' : '-' }}¥{{ Number(island.amt).toFixed(2) }}</template>
            <template v-else>金额待填</template>
          </span>
        </span>
        <span class="arrow">&#9660;</span>
      </div>
      <template v-if="island.open">
        <div class="island-detail">
          <div class="island-row"><span class="lbl">来源</span><span style="color:#fff">{{ island.src }}</span></div>
          <div class="island-row"><span class="lbl">类型</span>
            <select v-model.number="island.type">
              <option :value="1">收入</option><option :value="2">支出</option>
            </select>
          </div>
          <div class="island-row"><span class="lbl">金额</span><input class="iamt" type="number" v-model.number="island.amt" step="0.01"></div>
          <div class="island-row"><span class="lbl">分类</span>
            <select v-model.number="island.catId">
              <option v-for="c in islandCats" :key="c.id" :value="c.id">{{ c.name }}</option>
            </select>
          </div>
          <div class="island-row"><span class="lbl">日期</span><input type="date" v-model="island.date"></div>
          <div class="island-row"><span class="lbl">备注</span><input v-model="island.note" placeholder="选填"></div>
        </div>
        <div class="island-actions">
          <button class="btn-no" @click="island.show = false">忽略</button>
          <button class="btn-ok" @click="confirmIsland">确认记账</button>
        </div>
      </template>
    </div>
  </div>

  <template v-if="tab === 0">
    <div class="summary">
      <div class="sum-block"><div class="sum-label">收入</div><div class="sum-value green">+{{ sumIn }}</div></div>
      <div class="sum-divider"></div>
      <div class="sum-block"><div class="sum-label">支出</div><div class="sum-value red">-{{ sumOut }}</div></div>
      <div class="sum-divider"></div>
      <div class="sum-block"><div class="sum-label">结余</div><div :class="'sum-value ' + (bal >= 0 ? 'green' : 'red')">{{ balSign }}{{ balAbs }}</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" @click="openAdd()" style="flex:2">+ 记一笔</button>
    </div>
    <div class="tx-list">
      <div class="date-group" v-for="g in groups" :key="g.key">
        <div class="date-head"><span class="date-text">{{ g.date }}</span><span class="date-sum">收入 {{ g.in }} 支出 {{ g.out }}</span></div>
        <div class="tx-row" v-for="t in g.items" :key="t.id" @click="editTx(t)">
          <div class="tx-left">
            <div class="tx-icon" :style="{ background: t.type === 1 ? '#e8f5e9' : '#ffebee' }">{{ t.emoji }}</div>
            <div><div class="tx-cat">{{ t.catName || '未分类' }}</div><div class="tx-meta">{{ t.srcName }}{{ t.note ? ' · ' + t.note : '' }}</div></div>
          </div>
          <div :class="'tx-amount ' + (t.type === 1 ? 'in' : 'out')">{{ t.sign }}¥{{ t.amt }}</div>
        </div>
      </div>
      <div class="empty" v-if="list.length === 0"><div class="empty-icon">📝</div><div>还没有记录</div><div style="font-size:12px;color:#bbb;margin-top:4px">点击下方按钮开始记账</div></div>
    </div>
    <button class="fab" @click="openAdd()">+</button>
  </template>

  <template v-if="tab === 1">
    <div class="month-nav"><span @click="prevM" style="color:#4CAF50;cursor:pointer">&#9664;</span> {{ statsYear }}年 {{ statsMonth }}月 <span @click="nextM" style="color:#4CAF50;cursor:pointer">&#9654;</span></div>
    <div class="summary" style="margin-bottom:12px">
      <div class="sum-block"><div class="sum-label">收入</div><div class="sum-value green">+{{ statsSumIn }}</div></div>
      <div class="sum-divider"></div>
      <div class="sum-block"><div class="sum-label">支出</div><div class="sum-value red">-{{ statsSumOut }}</div></div>
      <div class="sum-divider"></div>
      <div class="sum-block"><div class="sum-label">结余</div><div :class="'sum-value ' + (statsBal >= 0 ? 'green' : 'red')">{{ statsBalSign }}{{ statsBalAbs }}</div></div>
    </div>
    <div class="chart">
      <div class="chart-title">支出分类排行</div>
      <div class="chart-item" v-for="(c, i) in topCats" :key="c.name">
        <div class="chart-label"><span>{{ c.name }}</span><span>{{ c.amount }}</span></div>
        <div class="chart-bar"><div class="chart-fill" :style="{ width: c.pct + '%', background: colors[i % 10] }"></div></div>
      </div>
      <div v-if="topCats.length === 0" style="text-align:center;color:#999;padding:30px">暂无支出数据</div>
    </div>
    <div class="chart" style="margin-top:12px">
      <div class="chart-title">收入分类排行</div>
      <div class="chart-item" v-for="(c, i) in topInCats" :key="c.name">
        <div class="chart-label"><span>{{ c.name }}</span><span>{{ c.amount }}</span></div>
        <div class="chart-bar"><div class="chart-fill" :style="{ width: c.pct + '%', background: colors[i % 10] }"></div></div>
      </div>
      <div v-if="topInCats.length === 0" style="text-align:center;color:#999;padding:30px">暂无收入数据</div>
    </div>
  </template>

  <template v-if="tab === 2">
    <div class="set-card" style="margin-top:12px">
      <div class="set-row" @click="refreshStatus"><span>监听服务</span><span :style="{color: serviceRunning===true?'#4CAF50':serviceRunning===false?'#F44336':'#999',fontSize:'13px'}">{{serviceRunning===true?'运行中':serviceRunning===false?'已断开':'检测中...'}}</span></div>
      <div class="set-row" @click="openNotifySettings"><span>通知监听权限</span><span style="color:#4CAF50;font-size:13px">去授权</span></div>
      <div class="set-row" @click="openOverlaySettings"><span>悬浮窗权限</span><span :style="{color: overlayOk?'#4CAF50':'#F44336',fontSize:'13px'}">{{overlayOk?'已开启':'去开启'}}</span></div>
      <div class="set-row" @click="showDebug=!showDebug;if(showDebug)loadDebugLog()"><span>🔍 调试日志</span><span style="color:#999;font-size:13px">{{showDebug?'收起':'展开'}}</span></div>
      <div v-if="showDebug" style="padding:8px 16px;background:#f9f9f9;font-size:11px;max-height:200px;overflow-y:auto;white-space:pre-wrap;font-family:monospace;color:#666">{{debugLog||'暂无日志'}}</div>
      <div class="set-row" @click="dlgClear = true"><span>清除所有数据</span><span style="color:#F44336;font-size:13px">危险操作</span></div>
    </div>
    <div class="set-card">
      <div class="set-row"><span>版本</span><span style="color:#999">2.0.4</span></div>
      <div class="set-row"><span>记录总数</span><span style="color:#999">{{ list.length }} 条</span></div>
      <div class="set-row"><span>数据存储</span><span style="color:#4CAF50">手机本地 · 无需联网</span></div>
    </div>
  </template>

  <div class="tab-bar">
    <div :class="'tab-item' + (tab === 0 ? ' active' : '')" @click="tab = 0"><span class="tab-emoji">📋</span>流水</div>
    <div :class="'tab-item' + (tab === 1 ? ' active' : '')" @click="switchTab(1)"><span class="tab-emoji">📊</span>统计</div>
    <div :class="'tab-item' + (tab === 2 ? ' active' : '')" @click="tab=2;refreshStatus()"><span class="tab-emoji">⚙️</span>设置</div>
  </div>

  <div class="modal-mask" v-if="modal" @click="closeModal"></div>
  <div class="modal-panel" v-if="modal">
    <div class="modal-head"><span @click="closeModal" style="color:#4CAF50;cursor:pointer">取消</span><span style="font-weight:600">{{ editId ? '修改记录' : '记一笔' }}</span><span @click="saveTx" style="color:#4CAF50;font-weight:600;cursor:pointer">保存</span></div>
    <div class="modal-body">
      <div class="type-toggle">
        <div :class="'type-btn' + (f.type === 2 ? ' sel-out' : '')" @click="f.type = 2">支出</div>
        <div :class="'type-btn' + (f.type === 1 ? ' sel-in' : '')" @click="f.type = 1">收入</div>
      </div>
      <div class="amount-box"><span class="yuan">¥</span><input type="number" v-model="f.amtStr" placeholder="0.00" step="0.01"></div>
      <div class="form-row" @click="pick = 'cat'"><span class="fl">分类</span><span class="fv">{{ catName || '选择' }} &#8250;</span></div>
      <div class="form-row" @click="pick = 'src'"><span class="fl">来源</span><span class="fv">{{ srcName || '选择' }} &#8250;</span></div>
      <div class="form-row"><span class="fl">日期</span><input type="date" v-model="f.date"></div>
      <div class="form-row"><span class="fl">备注</span><input v-model="f.note" placeholder="选填"></div>
      <button :class="'btn-save ' + (f.type === 1 ? 'inc' : 'exp')" @click="saveTx">{{ editId ? '保存修改' : '记一笔' }}</button>
      <button v-if="editId" style="width:100%;height:44px;border:none;border-radius:22px;color:#F44336;font-size:14px;background:#fff;border:1px solid #F44336;margin-top:10px" @click="delAndClose">删除这条记录</button>
    </div>
  </div>

  <div class="picker-mask" v-if="pick" @click="pick = null"></div>
  <div class="picker" v-if="pick">
    <div class="picker-head"><span @click="pick = null">取消</span><span style="font-weight:600">{{ pick === 'cat' ? '选择分类' : '选择来源' }}</span><span></span></div>
    <div class="picker-opt" v-for="o in pickOpts" :key="o.id" @click="selectPick(o)">
      <span>{{ o.name }}</span>
      <span v-if="o.id === pickVal" style="color:#4CAF50;font-weight:700">&#10003;</span>
    </div>
  </div>

  <div class="dlg-mask" v-if="dlgClear">
    <div class="dlg-box">
      <h3>确认清除</h3><p>删除全部记账数据，不可恢复！</p>
      <div class="dlg-btns">
        <button style="background:#f0f0f0" @click="dlgClear = false">取消</button>
        <button style="background:#F44336;color:#fff" @click="doClear">确定删除</button>
      </div>
    </div>
  </div>

  <div class="toast" v-if="msg" v-text="msg"></div>

</div>

<script src="vue.global.prod.js"></script>
<script>
const LS = 'ledger_txs';
const CATS = [
  {id:1,name:'餐饮',type:2,emoji:'🍽'},{id:2,name:'交通',type:2,emoji:'🚗'},{id:3,name:'购物',type:2,emoji:'🛒'},{id:4,name:'娱乐',type:2,emoji:'🎮'},
  {id:5,name:'住房',type:2,emoji:'🏠'},{id:6,name:'医疗',type:2,emoji:'💊'},{id:7,name:'教育',type:2,emoji:'📚'},{id:8,name:'人情',type:2,emoji:'🎁'},
  {id:9,name:'日用',type:2,emoji:'🧴'},{id:10,name:'其他支出',type:2,emoji:'💸'},{id:11,name:'工资',type:1,emoji:'💰'},{id:12,name:'理财',type:1,emoji:'📈'},
  {id:13,name:'兼职',type:1,emoji:'💼'},{id:14,name:'退款',type:1,emoji:'↩'},{id:15,name:'其他收入',type:1,emoji:'💵'}
];
const SRCS = [
  {id:1,name:'微信支付'},{id:2,name:'支付宝'},{id:3,name:'工商银行'},{id:4,name:'建设银行'},{id:5,name:'农业银行'},
  {id:6,name:'招商银行'},{id:7,name:'中国银行'},{id:8,name:'邮储银行'},{id:9,name:'交通银行'},{id:10,name:'现金'},{id:11,name:'其他'}
];
const COLS = ['#F44336','#FF9800','#4CAF50','#2196F3','#9C27B0','#00BCD4','#795548','#607D8B','#E91E63','#FF5722'];

function load(){try{const raw=localStorage.getItem(LS);if(!raw)return[];const data=JSON.parse(raw);if(!Array.isArray(data))throw new Error('数据格式错误');return data}catch(e){const bk=localStorage.getItem(LS+'_bak');if(bk){try{const restored=JSON.parse(bk);if(Array.isArray(restored)){localStorage.setItem(LS,bk);return restored}}catch(e2){}}return[]}}
function save(d){const raw=JSON.stringify(d);localStorage.setItem(LS+'_bak',localStorage.getItem(LS)||'');localStorage.setItem(LS,raw)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substring(2,8)}
function localDate(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toNum(v){const n=Number(v);return isNaN(n)?0:n}
function getSrcId(name){if(!name)return null;const s=SRCS.find(x=>x.name===name);if(s)return s.id;if(name.startsWith('微信'))return 1;if(name==='支付宝')return 2;return null}

const {createApp} = Vue;
const app = createApp({
  data(){
    const d=new Date();
    return{
      tab:0,list:load(),
      statsYear:d.getFullYear(),statsMonth:d.getMonth()+1,
      modal:false,editId:null,f:{type:2,amtStr:'',catId:null,srcId:null,date:'',note:''},
      pick:null,island:{show:false,open:false,type:2,amt:0,src:'',catId:null,date:'',note:''},
      dlgClear:false,msg:'',msgTimer:null,colors:COLS,showDebug:false,debugLog:'',serviceRunning:null,overlayOk:false,
    };
  },
  computed:{
    nowMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')},
    statsMonthKey(){return this.statsYear+'-'+String(this.statsMonth).padStart(2,'0')},

    sumIn(){
      let s=0;const m=this.nowMonth;
      this.list.forEach(t=>{if(t.date&&t.date.startsWith(m)&&t.type===1)s+=toNum(t.amount||t.amt)});
      return s.toFixed(2);
    },
    sumOut(){
      let s=0;const m=this.nowMonth;
      this.list.forEach(t=>{if(t.date&&t.date.startsWith(m)&&t.type===2)s+=toNum(t.amount||t.amt)});
      return s.toFixed(2);
    },
    bal(){return parseFloat(this.sumIn)-parseFloat(this.sumOut)},
    balAbs(){return Math.abs(this.bal).toFixed(2)},
    balSign(){return this.bal>=0?'+':'-'},

    groups(){
      const g={};const m=this.nowMonth;
      this.list.filter(t=>t.date&&t.date.startsWith(m))
        .sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))
        .forEach(t=>{
          const d=t.date.split('T')[0];
          if(!g[d])g[d]={key:d,date:d,items:[],in:0,out:0};
          const a=toNum(t.amount||t.amt);
          g[d].items.push({...t,emoji:this.getEmoji(t.catId,t.type),sign:t.type===1?'+':'-',amt:a});
          if(t.type===1)g[d].in+=a;else g[d].out+=a;
        });
      const r=Object.values(g);
      r.forEach(g=>{g.in=g.in.toFixed(2);g.out=g.out.toFixed(2)});
      return r;
    },

    statsSumIn(){
      let s=0;const m=this.statsMonthKey;
      this.list.forEach(t=>{if(t.date&&t.date.startsWith(m)&&t.type===1)s+=toNum(t.amount||t.amt)});
      return s.toFixed(2);
    },
    statsSumOut(){
      let s=0;const m=this.statsMonthKey;
      this.list.forEach(t=>{if(t.date&&t.date.startsWith(m)&&t.type===2)s+=toNum(t.amount||t.amt)});
      return s.toFixed(2);
    },
    statsBal(){return parseFloat(this.statsSumIn)-parseFloat(this.statsSumOut)},
    statsBalAbs(){return Math.abs(this.statsBal).toFixed(2)},
    statsBalSign(){return this.statsBal>=0?'+':'-'},

    topCats(){
      const m=this.statsMonthKey;const map={};
      this.list.filter(t=>t.type===2&&t.date&&t.date.startsWith(m))
        .forEach(t=>{const n=t.catName||'未分类';map[n]=(map[n]||0)+toNum(t.amount||t.amt)});
      const total=Object.values(map).reduce((a,b)=>a+b,0);
      return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10)
        .map(([name,amount])=>({name,amount:amount.toFixed(2),pct:total>0?Math.round(amount/total*100):0}));
    },
    topInCats(){
      const m=this.statsMonthKey;const map={};
      this.list.filter(t=>t.type===1&&t.date&&t.date.startsWith(m))
        .forEach(t=>{const n=t.catName||'未分类';map[n]=(map[n]||0)+toNum(t.amount||t.amt)});
      const total=Object.values(map).reduce((a,b)=>a+b,0);
      return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10)
        .map(([name,amount])=>({name,amount:amount.toFixed(2),pct:total>0?Math.round(amount/total*100):0}));
    },

    pickOpts(){return this.pick==='cat'?CATS.filter(c=>c.type===this.f.type):SRCS},
    pickVal(){return this.pick==='cat'?this.f.catId:this.f.srcId},
    catName(){const c=CATS.find(x=>x.id===this.f.catId);return c?c.name:''},
    srcName(){const s=SRCS.find(x=>x.id===this.f.srcId);return s?s.name:''},

    islandCats(){return CATS.filter(c=>c.type===this.island.type)},
  },
  mounted(){
    this.startNativeIsland();
  },
  methods:{
    toast(t){this.msg=t;clearTimeout(this.msgTimer);this.msgTimer=setTimeout(()=>this.msg='',1500)},

    startNativeIsland(){
      if (window._islandInited) return;
      window._islandInited = true;

      window.quickAddHandler = () => { if (!this.modal) this.openAdd(); };

      window._confirmed = {};

      window.pendingTxHandler = (data) => {
        if (!data || !data.source) return;
        const key = data.source + '_' + (Number(data.amount)||0) + '_' + (data.type||2);
        if (window._confirmed[key]) return;
        // 去重：金额转为数字比较，防止 '' === 0 为 false 的 bug
        const amt = Number(data.amount) || 0;
        if (this.island.show && this.island.src === data.source && Number(this.island.amt) === amt) return;
        this.showIsland({
          sourceName: data.source,
          amount: amt,
          type: data.type || 2,
          needManualAmount: amt <= 0
        }, data.raw || '');
        window._confirmed[key] = true;
      };

      // 轮询等待 NativeBridge 注入
      const tryBridge = () => {
        if (window.NativeBridge) {
          try {
            this.serviceRunning = window.NativeBridge.isServiceRunning ? window.NativeBridge.isServiceRunning() : null;
            this.overlayOk = window.NativeBridge.hasOverlayPermission ? window.NativeBridge.hasOverlayPermission() : false;
            if (!this.serviceRunning) {
              this.debugLog = '⚠ 通知监听服务未运行！\n请在 设置→通知监听权限 中重新授权\n' + this.debugLog;
            }
            if (window.NativeBridge.start) window.NativeBridge.start();
          } catch(e) {}
        } else {
          setTimeout(tryBridge, 500);
        }
      };
      setTimeout(tryBridge, 300);
    },

    reload(){this.list=load()},
    getEmoji(catId,type){const c=CATS.find(x=>x.id===catId);return c?c.emoji:(type===1?'💰':'💳')},

    openAdd(){this.editId=null;this.f={type:2,amtStr:'',catId:null,srcId:null,date:localDate(),note:''};this.modal=true},
    editTx(t){this.editId=t.id;const d=t.date?t.date.split('T')[0]:localDate();this.f={type:t.type,amtStr:String(t.amount),catId:t.catId,srcId:t.srcId,date:d,note:t.note||''};this.modal=true},
    closeModal(){this.modal=false},
    saveTx(){
      const a=parseFloat(this.f.amtStr);if(isNaN(a)||a<=0)return this.toast('请输入有效金额');
      const d={type:this.f.type,amount:a,catId:this.f.catId,catName:this.catName,srcId:this.f.srcId,srcName:this.srcName,date:this.f.date,note:this.f.note};
      if(this.editId){const list=load();const i=list.findIndex(t=>t.id===this.editId);if(i>=0){list[i]={...list[i],...d};save(list)}}
      else{const list=load();list.push({id:uid(),...d});save(list)}
      this.reload();this.modal=false;this.toast(this.editId?'修改成功':'记账成功');
    },
    delTx(id){save(load().filter(t=>t.id!==id));this.reload();this.toast('已删除')},
    delAndClose(){this.delTx(this.editId);this.modal=false},

    selectPick(o){if(this.pick==='cat'){this.f.catId=o.id}else{this.f.srcId=o.id};this.pick=null},

    switchTab(t){this.tab=t;if(t===1)this.reload();if(t===2)this.refreshStatus()},
    refreshStatus(){
      try{
        if(window.NativeBridge){
          this.serviceRunning = window.NativeBridge.isServiceRunning ? window.NativeBridge.isServiceRunning() : null;
          this.overlayOk = window.NativeBridge.hasOverlayPermission ? window.NativeBridge.hasOverlayPermission() : false;
        }
      }catch(e){}
    },
    prevM(){this.statsMonth--;if(this.statsMonth<1){this.statsMonth=12;this.statsYear--};this.reload()},
    nextM(){this.statsMonth++;if(this.statsMonth>12){this.statsMonth=1;this.statsYear++};this.reload()},

    openNotifySettings(){
      try { if(window.NativeBridge&&window.NativeBridge.openNotificationSettings) { window.NativeBridge.openNotificationSettings(); } }
      catch(e) { this.toast('请在系统设置→通知使用权中开启'); }
    },
    openOverlaySettings(){
      try { if(window.NativeBridge&&window.NativeBridge.openOverlaySettings) { window.NativeBridge.openOverlaySettings(); } }
      catch(e) { this.toast('请在系统设置→显示在其他应用上层中开启'); }
    },
    loadDebugLog(){
      try {
        if(window.NativeBridge&&window.NativeBridge.getDebugLog) {
          this.debugLog = window.NativeBridge.getDebugLog();
        } else { this.debugLog = '(非原生环境，无日志)'; }
      } catch(e) { this.debugLog = '获取日志失败'; }
    },
    doClear(){save([]);try{localStorage.removeItem(LS+'_bak')}catch(e){}this.reload();this.dlgClear=false;this.toast('数据已清除')},

    showIsland(parsed,raw){
      const cat=CATS.find(c=>c.type===parsed.type);
      const needAmt = parsed.needManualAmount || !parsed.amount || parsed.amount <= 0;
      this.island={
        show:true, open: needAmt,
        type:parsed.type, src:parsed.sourceName, amt: Number(parsed.amount) || 0,
        catId:cat?cat.id:null, date:localDate(), note:(raw||'').substring(0,80),
        needAmount: needAmt
      };
    },
    confirmIsland(){
      const a=Number(this.island.amt);if(isNaN(a)||a<=0)return this.toast('请输入有效金额');
      const c=CATS.find(x=>x.id===this.island.catId);
      const list=load();list.push({id:uid(),type:this.island.type,amount:a,catId:this.island.catId,catName:c?c.name:'',srcId:getSrcId(this.island.src),srcName:this.island.src,date:this.island.date,note:this.island.note});
      save(list);this.reload();this.island.show=false;this.toast('记账成功');
    },
  },
  watch:{
    'island.type'(){const cat=CATS.find(c=>c.type===this.island.type);if(cat)this.island.catId=cat.id}
  }
});

app.mount('#app');
</script>
</body>
</html>
